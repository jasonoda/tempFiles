<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Cube Ninja</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="game-shell">
    <div id="game-stage" aria-label="Cube Ninja — iPad portrait">
      <canvas id="game-canvas"></canvas>
      <div class="scanlines" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div id="wrong-flash" aria-hidden="true"></div>

      <div id="game-time" class="hidden crt-text">0:00</div>

      <div id="start-screen">
        <button id="start-btn" class="crt-text" type="button">START</button>
      </div>

      <div id="lives" class="hidden" aria-label="Strikes">
        <span class="life crt-text">X</span>
        <span class="life crt-text">X</span>
        <span class="life crt-text">X</span>
      </div>

      <div id="game-over" class="hidden">
        <div class="screen-panel">
          <p class="game-over-title crt-text">GAME OVER</p>
          <p class="game-over-survived-label crt-text">TIME SURVIVED</p>
          <p id="game-over-time" class="game-over-time crt-text">0:00</p>
          <button id="restart-btn" class="crt-text" type="button">TRY AGAIN</button>
        </div>
      </div>

      <div id="target-callout" class="hidden crt-text" aria-live="polite"></div>
      <div id="miss-callout" class="hidden crt-text" aria-live="assertive">MISS!</div>
    </div>

    <button id="toggleCRT" type="button" class="dev-only">CRT ON</button>
    <div id="glow-control" class="dev-only">
      <label for="glowSlider">Glow</label>
      <input
        id="glowSlider"
        type="range"
        min="0"
        max="100"
        value="50"
        step="1"
      />
      <span id="glowValue">50%</span>
    </div>
  </div>

  <script type="module" src="scene.js"></script>
</body>
</html>
